<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1f2b">
  <title>Reef Light</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <button class="light-pick" data-action="lights" aria-label="Choose light">
      <span class="light-name" id="lightName">No light yet</span><span class="caret" aria-hidden="true">&#9662;</span>
    </button>
    <button class="status" id="status" data-action="status" data-state="idle">
      <span class="dot" aria-hidden="true"></span><span id="statusText">Not connected</span>
    </button>
  </header>
  <div class="glass" id="glass" aria-hidden="true"></div>

  <main>
    <div id="demoBanner" class="banner demo" hidden>
      <span><strong>Demo mode.</strong> This is a simulated light. Install the Android app to control your real one.</span>
    </div>
    <section id="view-schedule" class="view" aria-label="Schedule"></section>
    <section id="view-manual" class="view" aria-label="Manual" hidden></section>
    <section id="view-more" class="view" aria-label="More" hidden></section>
  </main>

  <div class="savebar" id="savebar">
    <span class="note" id="saveNote">Everything is saved on the light</span>
    <button class="btn primary" id="saveBtn" data-action="save">Save to light</button>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="schedule" aria-selected="true">Schedule</button>
    <button role="tab" data-view="manual" aria-selected="false">Manual</button>
    <button role="tab" data-view="more" aria-selected="false">Lights &amp; backup</button>
  </nav>

  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="grab" aria-hidden="true"></div>
      <h3 id="sheetTitle"></h3>
      <div id="sheetBody"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/protocol.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/astro.js"></script>
  <script src="js/natural.js"></script>
  <script src="js/par.js"></script>
  <script src="js/par-data.js"></script>
  <script src="js/mock-light.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
