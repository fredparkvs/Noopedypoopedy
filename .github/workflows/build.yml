name: Test and build (Android and Mac)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Protocol and schedule tests
        run: node --test tests/*.test.js

      - name: UI tests in a headless browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Unit tests and APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ReefLight-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Mac app tests (core, and the app itself on a virtual display)
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm test
          ./scripts/sync-www.sh
          xvfb-run -a node test/app.e2e.js

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and ad-hoc sign the Mac apps
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm test
          ./scripts/build-mac.sh
          for a in arm64 x64; do
            codesign --force --deep --sign - "dist/Reef Light-darwin-$a/Reef Light.app"
            codesign --verify --deep --strict "dist/Reef Light-darwin-$a/Reef Light.app"
            (cd "dist/Reef Light-darwin-$a" && ditto -c -k --keepParent "Reef Light.app" "../ReefLight-mac-$a.zip")
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ReefLight-mac
          path: desktop/dist/ReefLight-mac-*.zip
